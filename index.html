<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dice Decider - roll two dice and settle it. By Michael Fourie." />
    <meta name="theme-color" content="#0e1b17" />
    <title>Dice Decider - Michael Fourie</title>
    <link rel="stylesheet" href="styles.css?v=20261112" />
  </head>
  <body>
    <main>
      <h1 id="result" aria-live="polite">Roll to decide</h1>
      <div class="arena">
        <section class="player" id="p1"><h2>Player 1</h2><div class="die" aria-label="Die 1"></div><p class="wins">Wins: <b id="w1">0</b></p></section>
        <span class="vs">VS</span>
        <section class="player" id="p2"><h2>Player 2</h2><div class="die" aria-label="Die 2"></div><p class="wins">Wins: <b id="w2">0</b></p></section>
      </div>
      <button id="roll" class="roll">Roll the dice <kbd>Space</kbd></button>
      <p class="stats">Rounds: <b id="rounds">0</b> · Draws: <b id="draws">0</b> · <button id="reset" class="link">Reset</button></p>
    </main>
    <footer>🎲 Michael Fourie · <a href="https://michaelfourie.co.za">michaelfourie.co.za</a> 🎲</footer>
    <script src="index.js?v=20261112"></script>
  </body>
</html>
